name: Visual LÖVE smoke captures (Linux)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install LÖVE and virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y love xvfb
          love --version
      - name: Render UI screen states
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          set -e
          for scene in title gallery newCanvas editor brush layer color tools; do
            echo "Capturing $scene"
            xvfb-run -a -s "-screen 0 1440x900x24" env IBIS_LUA_SCREENSHOT="$scene" timeout 20 love .
          done
          mkdir -p screenshots
          find "$HOME/.local/share/love/ibis-lua" -name 'ibis-lua-*.png' -type f -exec cp {} screenshots/ \;
          test "$(find screenshots -name '*.png' | wc -l)" -eq 8
      - uses: actions/upload-artifact@v4
        with:
          name: ibis-lua-windows-ui-linux-render-preview
          path: screenshots/*.png
          if-no-files-found: error
