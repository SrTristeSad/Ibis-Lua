name: Lua visual shell checks
on:
  push:
  pull_request:
jobs:
  syntax-and-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Parse Lua source
        run: find . -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Check UI geometry
        run: lua5.4 tests/test_layout.lua && lua5.4 tests/test_shell.lua && lua5.4 tests/test_visual_flow.lua
