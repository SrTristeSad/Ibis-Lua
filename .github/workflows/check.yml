name: Lua model and screenshot tooling

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and screenshot test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit love xvfb
          python -m pip install -r requirements-dev.txt
      - name: Check syntax of every Lua source
        run: |
          while IFS= read -r file; do
            luajit -b "$file" /dev/null
          done < <(find . -name '*.lua' -type f | sort)
        shell: bash
      - name: Run state, viewport and solo layer tests
        run: |
          luajit tests/test_model.lua
          luajit tests/test_viewport.lua
          luajit tests/test_layer_solo.lua
          luajit tests/test_layer_properties.lua
          luajit tests/test_view_state.lua
          luajit tests/test_canvas_presets.lua
          luajit tests/test_gallery.lua
          luajit tests/test_brush_catalog.lua
      - name: Run screenshot comparator and layout checker unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Exercise real LÖVE click callbacks end-to-end
        run: |
          timeout 20s xvfb-run -a env IBIS_LUA_E2E=1 love .
          timeout 20s xvfb-run -a -s "-screen 0 1920x1080x24" env IBIS_LUA_E2E=1 IBIS_LUA_E2E_RES=1600x900 love .
      - name: Exercise Gallery folder creation, move and rename end-to-end
        run: timeout 20s xvfb-run -a env IBIS_LUA_GALLERY_E2E=1 love .
      - name: Run LÖVE and capture twenty-four UI states
        run: |
          mkdir -p screenshots
          for screen in title gallery gallery_new gallery_folders gallery_inside gallery_selection gallery_many new_canvas new_canvas_dpi editor layer layer_floating layer_properties layer_blend transparent brush brush_search color zoom solo view grid_settings grid reference; do
            echo "Capturing UI state: $screen"
            timeout 20s xvfb-run -a env IBIS_LUA_SMOKE=1 IBIS_LUA_SCREEN="$screen" love .
            cp "$HOME/.local/share/love/ibis-lua-fidelity/ci-smoke.png" "screenshots/$screen.png"
            test -s "screenshots/$screen.png"
          done
      - name: Check structural screenshot regression
        run: python tools/check_ui_screenshots.py screenshots
      - name: Save screenshots for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibis-lua-windows-ui-smoke
          path: screenshots/*.png
          if-no-files-found: warn
